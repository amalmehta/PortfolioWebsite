# Once a week (and on demand from the Actions tab): checks every external link on the site,
# and that the Skills list's "updated" date is under six months old. Either failing fails
# the run, and GitHub emails the repo owner.
name: Links
on:
  schedule:
    - cron: "0 15 * * 1"   # Mondays, 08:00 Pacific
  workflow_dispatch:
jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python tools/check-links.py
      - name: Skills list is recent
        if: always()
        run: python tools/check-staleness.py
