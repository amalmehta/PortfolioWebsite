<style>
.drop{stroke:#cfdbe6;stroke-width:2;stroke-linecap:round;opacity:.55;animation:fall linear infinite}
@keyframes fall{from{transform:translateY(-120px)}to{transform:translateY(620px)}}
.streak{fill:none;stroke:#dfe8f0;stroke-width:3;stroke-linecap:round;opacity:.35;animation:slide 9s ease-in infinite}
@keyframes slide{0%{transform:translateY(-40px);opacity:0}20%{opacity:.4}100%{transform:translateY(260px);opacity:0}}
.bead{fill:#e9f0f6;opacity:.45}
.steam{fill:none;stroke:#f4ece0;stroke-width:3;stroke-linecap:round;opacity:.5;animation:rise 4s ease-in-out infinite}
@keyframes rise{0%{transform:translateY(6px);opacity:0}40%{opacity:.55}100%{transform:translateY(-14px);opacity:0}}
@media (prefers-reduced-motion: reduce){.drop,.streak,.steam{animation:none}}
</style>
