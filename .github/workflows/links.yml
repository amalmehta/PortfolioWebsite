# Checks every external link on the site once a week (and on demand from the Actions tab).
# A broken link fails the run, and GitHub emails the repo owner.
name: Links
on:
  schedule:
    - cron: "0 15 * * 1"   # Mondays, 08:00 Pacific
  workflow_dispatch:
jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/check-links.py
